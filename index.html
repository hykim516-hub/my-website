<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV.PORTFOLIO 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9;
            letter-spacing: -0.02em;
        }
        .card-blue-1 { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
        .card-blue-2 { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .card-blue-3 { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card-blue-4 { background: linear-gradient(135deg, #334155 0%, #475569 100%); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="text-slate-800 pb-12">

<!-- 상단 헤더 -->
<header class="bg-white border-b border-slate-200 py-4 px-4 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
        <span class="text-base font-black tracking-tight text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-code text-blue-600"></i> DEV.PORTFOLIO
        </span>
        <div class="flex items-center gap-2">
            <span class="text-[11px] font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-full">
                Frontend Developer
            </span>
        </div>
    </div>
</header>

<!-- 메인 컨텐츠 -->
<main class="max-w-5xl mx-auto px-4 mt-6">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

        <!-- 왼쪽 사이드바 -->
        <div class="md:col-span-5 space-y-6 md:sticky md:top-24">

            <!-- 비전 카드 -->
            <section class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-terminal text-blue-600"></i> DEVELOPER MOTTO
                    </h2>
                    <button onclick="randomizeQuote()" class="text-xs text-slate-400 hover:text-blue-600 flex items-center gap-1 transition">
                        <i class="fa-solid fa-arrows-rotate text-[10px]"></i> 다른 슬로건
                    </button>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <div id="quote-card" class="card-blue-1 rounded-xl p-6 text-white min-h-[180px] flex flex-col justify-between transition-all duration-500 relative overflow-hidden shadow-md">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/5 rounded-full blur-xl pointer-events-none"></div>
                        <div class="my-auto py-2 text-center z-10">
                            <p id="quote-text" class="text-base md:text-lg font-bold leading-relaxed mb-4 transition-all duration-300">
                                "사용자 경험을 최우선으로 생각하는 반응형 & 동적 웹을 설계합니다."
                            </p>
                            <p id="quote-ref" class="text-xs opacity-75 tracking-wider font-normal transition-all duration-300">
                                - Core Engineering Values
                            </p>
                        </div>
                        <div class="flex justify-between items-center text-[10px] opacity-60 mt-2 z-10 border-t border-white/10 pt-2.5">
                            <span class="tracking-widest">FOCUS AREA</span>
                            <span id="quote-theme" class="bg-white/10 px-2.5 py-0.5 rounded-full font-medium text-[9px]">Frontend Architecture</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mt-3">
                        <button onclick="changeCardBackground()" class="py-2.5 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center justify-center gap-1.5 transition border border-slate-200">
                            <i class="fa-solid fa-palette text-blue-500"></i> 배경 변경
                        </button>
                        <button onclick="copyContact()" class="py-2.5 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center justify-center gap-1.5 transition border border-slate-200">
                            <i class="fa-solid fa-copy text-blue-500"></i> 이메일 복사
                        </button>
                    </div>
                </div>
            </section>

            <!-- 방명록 입력 -->
            <section class="space-y-3">
                <div class="px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-pen-to-square text-blue-600"></i> 방명록 작성
                    </h2>
                </div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                    <div class="flex gap-3">
                        <div class="w-1/2">
                            <input type="text" id="guest-author" placeholder="작성자/소속" maxlength="12"
                                class="w-full px-3 py-2.5 text-xs font-medium rounded-lg bg-slate-50 border border-slate-200 focus:bg-white focus:outline-none focus:border-blue-500 transition-all">
                        </div>
                        <div class="w-1/2">
                            <select id="guest-category" class="w-full px-3 py-2.5 text-xs font-medium rounded-lg bg-slate-50 border border-slate-200 focus:bg-white focus:outline-none focus:border-blue-500 transition-all">
                                <option value="응원메시지">응원/인사</option>
                                <option value="프로젝트문의">프로젝트 문의</option>
                                <option value="기술피드백">기술 피드백</option>
                            </select>
                        </div>
                    </div>
                    <textarea id="guest-content" rows="4" placeholder="메시지를 남겨주세요."
                        class="w-full p-3.5 text-xs font-medium rounded-lg bg-slate-50 border border-slate-200 focus:bg-white focus:outline-none focus:border-blue-500 resize-none leading-relaxed placeholder-slate-400 transition-all"></textarea>
                    <button onclick="submitGuestbook()"
                        class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg text-xs transition tracking-wider shadow-md shadow-blue-700/10">
                        메시지 등록
                    </button>
                </div>
            </section>
        </div>

        <!-- 오른쪽 메인 영역 -->
        <div class="md:col-span-7 space-y-6">

            <!-- 기술 스택 -->
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group text-blue-600"></i> SKILL STACK
                </h3>
                <div class="flex flex-wrap gap-2">
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 border border-slate-200">HTML5 / CSS3</span>
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 border border-slate-200">JavaScript (ES6+)</span>
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-blue-50 text-blue-700 border border-blue-100">Tailwind CSS</span>
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-100">LocalStorage API</span>
                </div>
            </section>

            <!-- 방명록 목록 -->
            <div class="space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-comments text-blue-600"></i> GUESTBOOK FEED
                    </h2>
                    <span id="feed-count" class="text-[10px] font-bold text-slate-400 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-full">0건</span>
                </div>
                <div id="feed-list" class="space-y-3">
                    <!-- 스크립트에서 동적 생성 -->
                </div>
            </div>

        </div>

    </div>
</main>

<!-- 토스트 알림 -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-3 rounded-full text-xs font-semibold shadow-lg opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 whitespace-nowrap">
    <span class="text-emerald-400"><i class="fa-solid fa-circle-check"></i></span>
    <span id="toast-message">알림</span>
</div>

<script>
    const slogans = [
        { text: "사용자 경험을 최우선으로 생각하는 반응형 & 동적 웹을 설계합니다.", ref: "Core Engineering Values", theme: "Frontend Architecture" },
        { text: "확장 가능하고 유지보수가 용이한 모듈식 코드를 지향합니다.", ref: "Clean Code Standard", theme: "Software Design" },
        { text: "직관적이고 매끄러운 UI/UX 인터페이스를 구현합니다.", ref: "Interactive Web Paradigm", theme: "UI/UX Design" }
    ];

    const bgClasses = ['card-blue-1', 'card-blue-2', 'card-blue-3', 'card-blue-4'];
    let currentSloganIdx = 0;
    let currentBgIdx = 0;
    let feedItems = [];

    window.onload = function() {
        // 로컬 스토리지에서 방명록 데이터 불러오기
        const saved = localStorage.getItem('portfolio_pure_local_feed');
        if (saved) {
            try { feedItems = JSON.parse(saved); } catch(e) { feedItems = []; }
        } else {
            feedItems = [
                { id: '1', author: '방문자', category: '응원메시지', content: '깔끔한 UI 구성이 인상적입니다!', date: '2026-08-01' }
            ];
            saveLocal();
        }
        renderFeed();
    };

    function saveLocal() {
        localStorage.setItem('portfolio_pure_local_feed', JSON.stringify(feedItems));
    }

    function randomizeQuote() {
        currentSloganIdx = (currentSloganIdx + 1) % slogans.length;
        const item = slogans[currentSloganIdx];
        document.getElementById('quote-text').innerText = `"${item.text}"`;
        document.getElementById('quote-ref').innerText = `- ${item.ref}`;
        document.getElementById('quote-theme').innerText = item.theme;
    }

    function changeCardBackground() {
        const card = document.getElementById('quote-card');
        card.classList.remove(bgClasses[currentBgIdx]);
        currentBgIdx = (currentBgIdx + 1) % bgClasses.length;
        card.classList.add(bgClasses[currentBgIdx]);
    }

    function copyContact() {
        navigator.clipboard.writeText("developer@example.com");
        showToast("이메일 주소가 복사되었습니다.");
    }

    function submitGuestbook() {
        const author = document.getElementById('guest-author').value.trim();
        const category = document.getElementById('guest-category').value;
        const content = document.getElementById('guest-content').value.trim();

        if (!author || !content) {
            showToast('작성자와 내용을 입력해주세요.');
            return;
        }

        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];

        const newItem = {
            id: 'item_' + Date.now(),
            author, category, content,
            date: dateStr
        };

        feedItems.unshift(newItem);
        saveLocal();
        renderFeed();

        document.getElementById('guest-author').value = '';
        document.getElementById('guest-content').value = '';
        showToast('메시지가 등록되었습니다.');
    }

    function deleteGuestbook(id) {
        feedItems = feedItems.filter(item => item.id !== id);
        saveLocal();
        renderFeed();
        showToast('메시지가 삭제되었습니다.');
    }

    function renderFeed() {
        const container = document.getElementById('feed-list');
        document.getElementById('feed-count').innerText = `${feedItems.length}건`;

        if (feedItems.length === 0) {
            container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center border border-slate-200 text-xs text-slate-400">작성된 방명록이 없습니다.</div>`;
            return;
        }

        container.innerHTML = feedItems.map(item => `
            <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm space-y-2">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-xs text-slate-800">${escapeHtml(item.author)}</span>
                        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200 font-medium">${item.category}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] text-slate-400">${item.date}</span>
                        <button onclick="deleteGuestbook('${item.id}')" class="text-slate-300 hover:text-red-500 transition text-xs">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(item.content)}</p>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toast-message').innerText = msg;
        t.style.opacity = '1';
        setTimeout(() => { t.style.opacity = '0'; }, 2500);
    }
</script>
</body>
</html>
